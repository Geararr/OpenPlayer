<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>OpenPlayer</title>

    <link rel="icon" type="image/svg" href="favicon.svg">

    <!-- List all fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&family=Lexend:wght@100..900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="styles.css">
    <script src="index.js" defer></script>
</head>
<body>
    <div class="top-bar">
        <h1 class="pg-icon">
            <img src="favicon.svg">
        </h1>
        <h1 class="pg-title">OpenPlayer</h1>
    </div>

    <div class="op-player-img">
        <img src="images/OpenPlayerIMG.svg">
    </div>

    <div class="description">
        <p>
            Free open-source music player!
            <br>
            Available on linux and windows.
        </p>
    </div> 

    <div class="download-buttons">
        <button class="d-button" id="linux-download">
            <img src="images/LinuxIMG.svg" alt="Linux"">
        </button>
        <button class="d-button" id="windows-x64-download">
            <img src="images/WinX64IMG.svg" alt="Windows"">
        </button>
        <button class="d-button" id="windows-x86-download">
            <img src="images/WinX86IMG.svg" alt="Windows"">
        </button>
    </div>

    <div class="credits">
        <p>
            Made by -> Gear & Lava
            <br>
            Programming -> Gear
            <br>
            Everything Else -> Lava
        </p>
    </div>
</body>
</html>
