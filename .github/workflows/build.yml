name: Build OpenPlayer

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            name: Linux
          - os: windows-latest
            name: Windows

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      - name: Setup vcpkg
        run: |
          git clone --depth 1 https://github.com/microsoft/vcpkg.git
        shell: bash

      - name: Bootstrap vcpkg (Linux)
        if: runner.os == 'Linux'
        run: ./vcpkg/bootstrap-vcpkg.sh
        shell: bash

      - name: Bootstrap vcpkg (Windows)
        if: runner.os == 'Windows'
        run: .\vcpkg\bootstrap-vcpkg.bat
        shell: cmd

      - name: Set VCPKG_ROOT (Linux)
        if: runner.os == 'Linux'
        run: echo "VCPKG_ROOT=$PWD/vcpkg" >> $GITHUB_ENV
        shell: bash

      - name: Set VCPKG_ROOT (Windows)
        if: runner.os == 'Windows'
        run: echo "Add-Content $env:GITHUB_ENV \"VCPKG_ROOT=$env:GITHUB_WORKSPACE\\vcpkg\""
        shell: cmd

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE="${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake"

      - name: Build Project
        run: cmake --build build --config Release

      - name: Run Packaging Script
        run: python post-Build.py

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OpenPlayer-${{ matrix.name }}
          path: |
            EXPORT/*

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            OpenPlayer-Linux/*
            OpenPlayer-Windows/*
          generate_release_notes: true