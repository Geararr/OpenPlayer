name: Build OpenPlayer

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            name: Linux
          - os: windows-latest
            name: Windows-x64
            arch: x64
          - os: windows-latest
            name: Windows-x86
            arch: Win32

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libfontconfig1-dev

      - name: Setup vcpkg
        run: |
          git clone --depth 1 https://github.com/microsoft/vcpkg.git
        shell: bash

      - name: Bootstrap vcpkg (Linux)
        if: runner.os == 'Linux'
        run: ./vcpkg/bootstrap-vcpkg.sh
        shell: bash

      - name: Bootstrap vcpkg (Windows)
        if: runner.os == 'Windows'
        run: .\vcpkg\bootstrap-vcpkg.bat
        shell: cmd

      - name: Set VCPKG_ROOT (Linux)
        if: runner.os == 'Linux'
        run: echo "VCPKG_ROOT=$PWD/vcpkg" >> $GITHUB_ENV
        shell: bash

      - name: Set VCPKG_ROOT (Windows)
        if: runner.os == 'Windows'
        run: Add-Content -Path $env:GITHUB_ENV -Value "VCPKG_ROOT=$env:GITHUB_WORKSPACE/vcpkg"
        shell: pwsh

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE="${{ env.VCPKG_ROOT }}/scripts/buildsystems/vcpkg.cmake" ${{ matrix.arch && format('-A {0}', matrix.arch) || '' }}

      - name: Show vcpkg install log on failure
        if: failure()
        run: |
          if (Test-Path "build/vcpkg-manifest-install.log") {
            Get-Content "build/vcpkg-manifest-install.log"
          }
        shell: pwsh

      - name: Build Project
        env:
          MAKEFLAGS: ""
          CARGO_BUILD_JOBS: "1"
        run: cmake --build build --config Release

      - name: Run Packaging Script
        run: python post-Build.py

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OpenPlayer-${{ matrix.name }}
          path: |
            EXPORT/*

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            OpenPlayer-Linux/*
            OpenPlayer-Windows-x64/*
            OpenPlayer-Windows-x86/*
          generate_release_notes: true