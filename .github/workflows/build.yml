name: Build OpenPlayer

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            name: Linux
          - os: windows-latest
            name: Windows

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v1
        with:
          vcpkgArguments: '${{ github.workspace }}/vcpkg.json'
          vcpkgDirectory: '${{runner.workspace }}/vcpkg'

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE=${{ env.VCPKG_ROOT }}/scripts/buildsystems/vcpkg.cmake

      - name: Build Project
        run: cmake --build build --config Release

      - name: Run Packaging Script
        run: python post-Build.py

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OpenPlayer-${{ matrix.name }}
          path: |
            EXPORT/*

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            OpenPlayer-Linux/*
            OpenPlayer-Windows/*
          generate_release_notes: true